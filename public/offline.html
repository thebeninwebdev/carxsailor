<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#163f31">
    <title>You're offline | CarXSailor</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; }
      body { align-items: center; background: #fafaf7; color: #163f31; display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; text-align: center; }
      main { max-width: 32rem; }
      h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 1rem; }
      p { color: #42584f; font-size: 1.125rem; line-height: 1.6; margin: 0 0 1.5rem; }
      button { background: #163f31; border: 0; border-radius: .5rem; color: #fff; cursor: pointer; font: inherit; padding: .8rem 1.2rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>CarXSailor needs a connection to load the latest cars and account details. Please reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
